services:
  mipo-api:
    build:
      context: ${MIPO_REMOTE_PATH:-/opt/mipo}/server
    restart: unless-stopped
    env_file:
      - ${MIPO_REMOTE_PATH:-/opt/mipo}/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      # The commit this container was recreated for, reported by /api/health.
      # `:-` and not `:?`: compose interpolates this whole file before it
      # applies profiles, so a required-variable form here would abort every
      # compose command on the host — which is how a deploy stalled on
      # 8 September. Started by hand without it, the API answers "unknown",
      # which is honest and harmless.
      MIPO_DEPLOY_SHA: ${MIPO_DEPLOY_SHA:-}
    healthcheck:
      # /api/health/schema, not /api/health: the latter is `select 1`, which
      # answers just as happily on a schema this build cannot use. `up --wait`
      # blocks on this, so a container whose code and schema disagree now fails
      # the deploy instead of being declared healthy.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=/dev/null http://127.0.0.1:3000/api/health/schema || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - type: bind
        source: ${MIPO_REMOTE_PATH:-/opt/mipo}/uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - type: bind
        source: ${MIPO_REMOTE_PATH:-/opt/mipo}/private-uploads
        target: /app/private-uploads
        bind:
          create_host_path: false
    networks:
      - mipo

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - mipo-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Read from the host .env. Production sets the mipo.pet pair; staging sets
      # only MIPO_SITE_ADDRESS plus MIPO_ROBOTS_POLICY.
      MIPO_SITE_ADDRESS: ${MIPO_SITE_ADDRESS:-mipo.pet}
      MIPO_WWW_ADDRESS: ${MIPO_WWW_ADDRESS:-http://localhost:8081}
      MIPO_ROBOTS_POLICY: ${MIPO_ROBOTS_POLICY:-}
    volumes:
      - ${MIPO_REMOTE_PATH:-/opt/mipo}/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MIPO_REMOTE_PATH:-/opt/mipo}/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mipo

  # Staging-only database. Guarded behind a compose profile so production, which
  # uses RDS, never starts it — `docker compose up` without --profile staging
  # ignores this service entirely.
  #
  # Brought up once when the staging host is provisioned:
  #   docker compose --profile staging up -d postgres
  #
  # It is not published to the host; only the mipo network can reach it.
  #
  # STAGING_DB_PASSWORD deliberately does not use the ${VAR:?message} form.
  # Compose interpolates the entire file before it decides which profiles are
  # active, so a required variable here aborts every compose command on the
  # production host — where the variable does not exist and this service never
  # runs. That is what stopped the deploy at "docker compose build". Left unset
  # it resolves to empty and the postgres image refuses to initialise without a
  # password, so the mistake is still caught, on staging, where it belongs.
  postgres:
    image: postgres:16-alpine
    profiles: ["staging"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_DB_NAME:-mipo}
      POSTGRES_USER: ${STAGING_DB_USER:-mipo}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USER:-mipo} -d ${STAGING_DB_NAME:-mipo}"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks:
      - mipo

networks:
  mipo:

volumes:
  caddy_data:
  caddy_config:
  staging_pgdata:
