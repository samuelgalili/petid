<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Assistant', 'Inter', -apple-system, sans-serif; }
    a { color: #A78BFA; } a:hover { color: #7C5CFA; }
    * { box-sizing: border-box; }
    .aurora-blob { position: absolute; border-radius: 999px; filter: blur(34px); pointer-events: none; }
    @keyframes drift-a { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,-10px) scale(1.12); } }
    @keyframes drift-b { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-16px,8px) scale(0.95); } }
    @keyframes drift-c { 0%,100% { transform: translate(0,0) scale(0.98); } 50% { transform: translate(10px,12px) scale(1.1); } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .card-in { animation: rise-in 300ms cubic-bezier(.22,1,.36,1) both; }
    input::placeholder { color: #A9A9B2; font-weight: 400; }
    input:focus { outline: none; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- The search field. At rest it sits centred; once there is a query it is
       pinned to the top and the results take the space. One element, two
       positions - not two designs. -->
  <div style="position: relative; display: flex; flex-direction: column; flex-grow: 1; transition: all 380ms cubic-bezier(.22,1,.36,1);">

    <sc-if value="{{ resting }}" hint-placeholder-val="{{ true }}">
      <div style="flex-grow: 1;"></div>
    </sc-if>

    <!-- Aurora + field -->
    <div style="position: relative; padding: 0 20px; flex-shrink: 0;">

      <!-- The aurora. Five blobs, one per brand stop, at the 12-16% fill
           weight the colour system allows for accents. Blurred and slow, so it
           reads as light behind glass rather than as a gradient border. -->
      <div style="position: absolute; inset: -46px 0 -46px 0; pointer-events: none; opacity: {{ auroraOpacity }}; transition: opacity 420ms ease;">
        <div class="aurora-blob" style="width: 150px; height: 84px; right: 6px; top: 6px; background: #FDBA74; opacity: 0.55; animation: drift-a 9s ease-in-out infinite;"></div>
        <div class="aurora-blob" style="width: 128px; height: 78px; right: 92px; top: 26px; background: #FB7185; opacity: 0.45; animation: drift-b 11s ease-in-out infinite;"></div>
        <div class="aurora-blob" style="width: 140px; height: 86px; left: 96px; top: 2px; background: #A78BFA; opacity: 0.5; animation: drift-c 10s ease-in-out infinite;"></div>
        <div class="aurora-blob" style="width: 132px; height: 80px; left: 14px; top: 30px; background: #60A5FA; opacity: 0.45; animation: drift-a 12s ease-in-out infinite;"></div>
        <div class="aurora-blob" style="width: 108px; height: 70px; left: 0px; top: 4px; background: #22D3EE; opacity: 0.38; animation: drift-b 8s ease-in-out infinite;"></div>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; background: rgba(255,255,255,0.86); backdrop-filter: blur(12px); border: 1px solid #E1E1E6; border-radius: 28px; box-shadow: 0 6px 24px rgba(21,21,26,0.06);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="1.6" stroke-linecap="round" style="flex-shrink: 0;">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input type="text" value="{{ query }}" onInput="{{ onType }}" placeholder="{{ placeholder }}" dir="rtl"
               style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 500; color: #15151A; min-width: 0;">
        <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ onClear }}" aria-label="נקה" style="flex-shrink: 0; width: 28px; height: 28px; border: none; background: #F6F6F3; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>

    <!-- Results. They appear as the first characters land - no submit, no
         spinner between the query and the first card. -->
    <div style="flex-grow: 1; overflow: hidden; padding: 0 20px;">

      <sc-if value="{{ resting }}" hint-placeholder-val="{{ false }}">
        <div style="padding-top: 18px; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 13px; color: #A9A9B2; font-weight: 500;">אפשר לשאול כל דבר</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <div style="padding: 9px 14px; background: #F6F6F3; border-radius: 999px; font-size: 13px; color: #6B6B76;">הכלב שלי משיר הרבה</div>
            <div style="padding: 9px 14px; background: #F6F6F3; border-radius: 999px; font-size: 13px; color: #6B6B76;">אוכל יבש לגור</div>
            <div style="padding: 9px 14px; background: #F6F6F3; border-radius: 999px; font-size: 13px; color: #6B6B76;">צעצוע לתוכי</div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
        <div style="padding-top: 16px;">
          <div style="font-size: 13px; color: #6B6B76; margin-bottom: 12px; font-weight: 500;">{{ resultLine }}</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
            <sc-for list="{{ results }}" as="item" hint-placeholder-count="4">
              <div class="card-in" style="background: #FFFFFF; border: 1px solid rgba(225,225,230,0.6); border-radius: 22px; overflow: hidden; box-shadow: 0 1px 2px rgba(21,21,26,0.04);">
                <div style="height: 104px; background: {{ item.tint }}; display: flex; align-items: center; justify-content: center;">
                  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
                    <path d="M3 16l5-5 4 4 3-3 6 6"></path><circle cx="8.5" cy="7.5" r="1.6"></circle><rect x="2.5" y="3.5" width="19" height="17" rx="3"></rect>
                  </svg>
                </div>
                <div style="padding: 10px 11px 12px;">
                  <div style="font-size: 12.5px; font-weight: 600; color: #15151A; line-height: 1.35; height: 34px; overflow: hidden;">{{ item.name }}</div>
                  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px;">
                    <div style="font-size: 14px; font-weight: 700; color: #15151A;">{{ item.price }}</div>
                    <button style="width: 30px; height: 30px; border: none; border-radius: 999px; background: #F6F6F3; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15151A" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    </button>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>

          <sc-if value="{{ isQuestion }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top: 14px; display: flex; align-items: center; gap: 10px; padding: 13px 15px; background: #F6F6F3; border-radius: 22px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0;">
                <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"></path>
              </svg>
              <div style="font-size: 13px; color: #15151A; font-weight: 500; line-height: 1.4;">להמשיך עם מיפו על זה</div>
              <div style="flex-grow: 1;"></div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "petName": {"editor": "text", "default": "רקסי"},
  "auroraStrength": {"editor": "range", "default": 0.34, "min": 0, "max": 1, "step": 0.02, "section": "Aurora"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: "" };
  }

  // The catalogue the search answers from. Real MIPO product names, taken from
  // the seeded catalogue rather than invented, so the widths and wrapping are
  // honest. Prices are sample values.
  catalogue() {
    return [
      { name: "MIPO Daily Chicken לכלבים", price: "₪129", tint: "#FDBA74", terms: "כלב אוכל יבש עוף גור בוגר" },
      { name: "Skin & Coat אומגה 3", price: "₪89", tint: "#FB7185", terms: "כלב פרווה שיער נשירה תוסף עור" },
      { name: "חטיפי אילוף עוף רכים", price: "₪24", tint: "#A78BFA", terms: "כלב חטיף אילוף עוף" },
      { name: "Urinary Balance לחתולים", price: "₪112", tint: "#60A5FA", terms: "חתול שתן בריאות אוכל" },
      { name: "כדור משחק עמיד", price: "₪39", tint: "#22D3EE", terms: "כלב צעצוע כדור משחק" },
      { name: "מיטה אורתופדית MIPO Cloud", price: "₪249", tint: "#FDBA74", terms: "כלב מיטה שינה מפרקים" },
      { name: "Joint Support חטיפי מפרקים", price: "₪98", tint: "#FB7185", terms: "כלב מפרקים תוסף חטיף" },
      { name: "קולר מתכוונן עם תג QR", price: "₪59", tint: "#A78BFA", terms: "כלב חתול קולר תג זיהוי" }
    ];
  }

  renderVals() {
    const query = this.state.query || "";
    const trimmed = query.trim();
    const hasQuery = trimmed.length > 0;
    const petName = this.props.petName ?? "רקסי";

    // Matching stands in for the server here. The real thing is the search
    // already in server/src/catalogRecommendations.js, which reads name, brand
    // and category and is the only path a product may reach a customer by.
    const words = trimmed.split(/\s+/).filter(Boolean);
    const results = !hasQuery ? [] : this.catalogue().filter((p) => {
      const hay = (p.name + " " + p.terms).toLowerCase();
      return words.some((w) => hay.includes(w.toLowerCase()));
    }).slice(0, 6);

    // A query with more than three words, or one that ends in a question mark,
    // reads as a question rather than a lookup - that is when the assistant is
    // offered, never by default.
    const isQuestion = hasQuery && (words.length > 3 || trimmed.endsWith("?"));

    const strength = this.props.auroraStrength ?? 0.34;

    return {
      query,
      hasQuery,
      resting: !hasQuery,
      isQuestion,
      results,
      placeholder: "מה המשאלה היום של " + petName + "...",
      resultLine: results.length > 0 ? results.length + " מוצרים" : "אין התאמה — אפשר לשאול אחרת",
      // The aurora brightens when the field is in use, so it reads as the
      // screen waking up rather than as decoration that is always on.
      auroraOpacity: hasQuery ? Math.min(1, strength + 0.28) : strength,
      onType: (e) => this.setState({ query: e.target.value }),
      onClear: () => this.setState({ query: "" })
    };
  }
}
</script>
</body>
</html>
