name: Deploy AWS

on:
  push:
    branches: [aws-migration, staging]
  workflow_dispatch:

permissions:
  contents: read

# Per-environment, so a staging deploy never queues behind a production one.
concurrency:
  group: aws-${{ github.ref_name == 'aws-migration' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Host, paths and secrets all resolve from the GitHub Environment, so the
    # same workflow serves both. Configure them under
    # Settings → Environments → production / staging.
    environment: ${{ github.ref_name == 'aws-migration' && 'production' || 'staging' }}

    env:
      MIPO_AWS_HOST: ${{ vars.MIPO_AWS_HOST || (github.ref_name == 'aws-migration' && '63.183.241.110' || '') }}
      MIPO_PUBLIC_BASE_URL: ${{ vars.MIPO_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | awk -F/ '{ name=$NF; if ((name == ".env" || name ~ /^\.env\./) && name != ".env.example") print }')"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files are forbidden:" >&2
            printf '%s\n' "$tracked_env" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Audit production dependencies
        run: npx --yes audit-ci@7.1.0 --config ./.audit-ci.jsonc

      - name: Audit server dependencies
        run: npm audit --prefix server --omit=dev --audit-level=high

      - name: Check server scripts
        run: |
          find server/src server/test -type f -name '*.js' -print0 |
            xargs -0 -n 1 node --check

      - name: Test server
        run: npm test --prefix server

      - name: Lint active code
        run: npm run lint

      - name: Typecheck active application
        run: npm run typecheck

      - name: Build production frontend
        shell: bash
        run: |
          set -euo pipefail
          public_base_url="${MIPO_PUBLIC_BASE_URL:-http://${MIPO_AWS_HOST}}"
          VITE_APP_URL="$public_base_url" VITE_API_URL=/api npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run AWS smoke tests against preview
        run: npm run test:e2e

      - name: Upload tested frontend
        uses: actions/upload-artifact@v4
        with:
          name: aws-frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aws-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy tested build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref_name == 'aws-migration' || github.ref_name == 'staging'

    # A separate environment from the quality gate's, and the only one that
    # carries a required reviewer. Approval is therefore asked for after the
    # tests have run and gone green, not before them: what you are approving is
    # a build you can already see the result of. Staging keeps deploying without
    # a gate — it exists to be deployed to.
    #
    # 'production-apply' must hold MIPO_AWS_SSH_PRIVATE_KEY and the MIPO_AWS_*
    # variables; see docs/DEPLOY_APPROVAL.md. Without the key this job stops at
    # "Configure SSH" before it has touched the host.
    environment: ${{ github.ref_name == 'aws-migration' && 'production-apply' || 'staging' }}

    env:
      MIPO_AWS_HOST: ${{ vars.MIPO_AWS_HOST || (github.ref_name == 'aws-migration' && '63.183.241.110' || '') }}
      MIPO_AWS_USER: ${{ vars.MIPO_AWS_USER || 'ubuntu' }}
      MIPO_REMOTE_PATH: ${{ vars.MIPO_REMOTE_PATH || '/opt/mipo' }}
      MIPO_PUBLIC_BASE_URL: ${{ vars.MIPO_PUBLIC_BASE_URL }}

    steps:
      - name: Verify deploy target
        env:
          TARGET_ENV: ${{ github.ref_name == 'aws-migration' && 'production' || 'staging' }}
        run: |
          set -euo pipefail

          if [ -z "${MIPO_AWS_HOST}" ]; then
            echo "MIPO_AWS_HOST is empty for the '${TARGET_ENV}' environment." >&2
            echo "Set it under Settings → Environments → ${TARGET_ENV} → Environment variables." >&2
            exit 1
          fi

          # A staging deploy must never reach the production host, whatever the
          # variables say.
          if [ "${TARGET_ENV}" = "staging" ] && [ "${MIPO_AWS_HOST}" = "63.183.241.110" ]; then
            echo "Refusing to deploy the staging branch to the production host." >&2
            exit 1
          fi

          echo "Deploying '${TARGET_ENV}' to ${MIPO_AWS_HOST} (${MIPO_REMOTE_PATH})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Check server scripts
        run: |
          find server/src -type f -name '*.js' -print0 |
            xargs -0 -n 1 node --check

      - name: Download tested frontend
        uses: actions/download-artifact@v4
        with:
          name: aws-frontend-${{ github.sha }}
          path: dist

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIPO_AWS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing GitHub secret MIPO_AWS_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mipo_aws_key
          chmod 600 ~/.ssh/mipo_aws_key
          ssh-keyscan -T 30 -H "$MIPO_AWS_HOST" >> ~/.ssh/known_hosts || true

      - name: Prepare remote directories
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mipo_aws_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "${MIPO_AWS_USER}@${MIPO_AWS_HOST}" \
            "sudo mkdir -p '${MIPO_REMOTE_PATH}/server' '${MIPO_REMOTE_PATH}/deploy/aws' '${MIPO_REMOTE_PATH}/dist' '${MIPO_REMOTE_PATH}/uploads' '${MIPO_REMOTE_PATH}/private-uploads' && sudo chown -R '${MIPO_AWS_USER}:${MIPO_AWS_USER}' '${MIPO_REMOTE_PATH}' && sudo chmod 700 '${MIPO_REMOTE_PATH}/private-uploads'"

      - name: Sync files
        run: |
          set -euo pipefail
          remote="${MIPO_AWS_USER}@${MIPO_AWS_HOST}"
          ssh_args="-i $HOME/.ssh/mipo_aws_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          rsync -az --delete \
            -e "ssh ${ssh_args}" \
            --exclude node_modules \
            --exclude .env \
            --exclude '.env.*' \
            server/ "${remote}:${MIPO_REMOTE_PATH}/server/"

          rsync -az --delete \
            -e "ssh ${ssh_args}" \
            deploy/aws/ "${remote}:${MIPO_REMOTE_PATH}/deploy/aws/"

          rsync -az --delete \
            -e "ssh ${ssh_args}" \
            dist/ "${remote}:${MIPO_REMOTE_PATH}/dist/"

      - name: Run migrations and restart services
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mipo_aws_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "${MIPO_AWS_USER}@${MIPO_AWS_HOST}" \
            "MIPO_REMOTE_PATH='${MIPO_REMOTE_PATH}' MIPO_DEPLOY_SHA='${GITHUB_SHA::12}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$MIPO_REMOTE_PATH"
          compose_file="$MIPO_REMOTE_PATH/deploy/aws/docker-compose.yml"

          sudo MIPO_REMOTE_PATH="$MIPO_REMOTE_PATH" bash "$MIPO_REMOTE_PATH/deploy/aws/prepare-host.sh"
          docker compose -f "$compose_file" build mipo-api

          # Migrations run automatically on every deploy and some of them are
          # destructive. Dump first, and stop here if the dump cannot be made.
          bash "$MIPO_REMOTE_PATH/deploy/aws/backup-before-migrate.sh" "$MIPO_REMOTE_PATH" "deploy-${MIPO_DEPLOY_SHA:-unknown}"

          # Then rehearse them against a throwaway copy of that dump. A
          # migration that trips over production's own data — as 0021 did over
          # six duplicate SKUs — now fails here, with production untouched,
          # instead of halfway through the real run with the schema already
          # changed and the previous API still serving against it.
          bash "$MIPO_REMOTE_PATH/deploy/aws/dry-run-migrations.sh" "$MIPO_REMOTE_PATH" </dev/null

          docker compose -f "$compose_file" run --rm --no-deps -T mipo-api node src/applyMigrations.js </dev/null
          docker compose -f "$compose_file" up -d --force-recreate --no-deps --wait --wait-timeout 60 mipo-api
          docker compose -f "$compose_file" up -d --force-recreate --no-deps caddy
          docker compose -f "$compose_file" ps
          REMOTE

      - name: Smoke test the deployed environment
        run: |
          set -euo pipefail
          base_url="${MIPO_PUBLIC_BASE_URL:-http://${MIPO_AWS_HOST}}"
          curl --fail --show-error --silent --max-time 15 "$base_url/api/health"
          curl --fail --show-error --silent --max-time 15 --head "$base_url/" >/dev/null
