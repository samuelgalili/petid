name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, aws-migration]

jobs:
  test:
    name: Quality gate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | awk -F/ '{ name=$NF; if ((name == ".env" || name ~ /^\.env\./) && name != ".env.example") print }')"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files are forbidden:" >&2
            printf '%s\n' "$tracked_env" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit server dependencies
        run: npm audit --prefix server --omit=dev --audit-level=high

      - name: Check server scripts
        run: |
          find server/src server/test -type f -name '*.js' -print0 |
            xargs -0 -n 1 node --check

      - name: Test server
        run: npm test --prefix server

      - name: Lint active code
        run: npm run lint

      - name: Typecheck active application
        run: npm run typecheck

      # Covers the part of src/ the typecheck above cannot see: anything the
      # running app no longer imports. Fails on an import with no module behind it.
      - name: Every import under src/ resolves
        run: npm run check:imports

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run AWS smoke tests against preview
        run: npm run test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
