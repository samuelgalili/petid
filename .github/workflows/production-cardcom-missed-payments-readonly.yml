# Cardcom missed-payment report, read-only.
#
# Manual only. Lists shop orders that may have been charged by Cardcom while
# the indicator webhook was answering 502. It never changes production.
#
# It follows production-d18-readonly.yml: same SSH path, same production
# environment, same connection handling, same redaction. Nothing here is a new
# access route.
#
# The SQL block is SELECT statements wrapped in BEGIN / SET TRANSACTION READ
# ONLY / ROLLBACK. A static check below refuses to run if that stops being true.
# No customer name, email, phone, address, or payment URL is selected. Order
# numbers and low-profile codes are the identifiers Cardcom already put in the
# alert mail.

name: Cardcom missed payments (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type the words  READ-ONLY  here (that exact text) to confirm this run only lists production orders'
        required: true
        default: ''

permissions:
  contents: read

# The deploy's own production group, so this read and a deploy can never run
# at the same time. The literal 'aws-production', not deploy-aws.yml's
# branch-derived expression: this workflow targets the production host
# whichever branch it is dispatched from.
concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  list:
    name: List unpaid Cardcom attempts (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: production

    env:
      MIPO_AWS_HOST: ${{ vars.MIPO_AWS_HOST || '63.183.241.110' }}
      MIPO_AWS_USER: ${{ vars.MIPO_AWS_USER || 'ubuntu' }}
      MIPO_REMOTE_PATH: ${{ vars.MIPO_REMOTE_PATH || '/opt/mipo' }}

    steps:
      - name: Confirm intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "READ-ONLY" ]; then
            echo "Nothing was contacted. Production was not touched." >&2
            echo "" >&2
            echo "The confirmation box has to contain exactly this text:" >&2
            echo "" >&2
            echo "    READ-ONLY" >&2
            echo "" >&2
            echo "Nine characters: R E A D hyphen O N L Y, capitals." >&2
            echo "Re-run the workflow and type it into the 'confirmation' field." >&2
            echo "" >&2
            echo "(This job reports the status code BLOCKED-PROD when it stops" >&2
            echo " early. That code is output, never input - do not type it.)" >&2
            exit 1
          fi
          echo "Confirmed: read-only Cardcom missed-payment list."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the embedded SQL is read-only
        run: |
          set -euo pipefail
          workflow=".github/workflows/production-cardcom-missed-payments-readonly.yml"
          sql="$(sed -n '/^[[:space:]]*-- CARDCOM-SQL-BEGIN$/,/^[[:space:]]*-- CARDCOM-SQL-END$/p' "$workflow")"
          if [ -z "$sql" ]; then
            echo "Could not extract the SQL block - the markers are missing." >&2
            exit 1
          fi

          if printf '%s\n' "$sql" | grep -inE \
            '^[[:space:]]*(insert|update|delete|alter|drop|create|grant|revoke|truncate|copy|call|do|vacuum|reindex|refresh|comment|lock|analyze|cluster|security)\b'; then
            echo "A non-SELECT statement is present in the Cardcom SQL block. Refusing to run." >&2
            exit 1
          fi

          for required in 'BEGIN;' 'SET TRANSACTION READ ONLY;' 'ROLLBACK;'; do
            if ! printf '%s\n' "$sql" | grep -qF "$required"; then
              echo "The SQL block is missing: $required" >&2
              exit 1
            fi
          done

          statements="$(printf '%s\n' "$sql" \
            | grep -vE '^[[:space:]]*--' \
            | grep -vE '^[[:space:]]*\\' \
            | tr '\n' ' ' | tr ';' '\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^$')"

          select_count="$(printf '%s\n' "$statements" | grep -ciE '^select' || true)"
          total_count="$(printf '%s\n' "$statements" | grep -c '' || true)"
          other="$(printf '%s\n' "$statements" | grep -ivE '^select' || true)"
          other_count="$(printf '%s\n' "$other" | grep -c '^.' || true)"

          if [ "$other_count" -ne 3 ]; then
            echo "Expected exactly 3 non-SELECT statements (BEGIN, SET TRANSACTION READ ONLY, ROLLBACK); found ${other_count}:" >&2
            printf '%s\n' "$other" >&2
            exit 1
          fi
          if ! printf '%s\n' "$other" | grep -qiE '^begin$' \
            || ! printf '%s\n' "$other" | grep -qiE '^set transaction read only$' \
            || ! printf '%s\n' "$other" | grep -qiE '^rollback$'; then
            echo "The three non-SELECT statements are not exactly BEGIN / SET TRANSACTION READ ONLY / ROLLBACK:" >&2
            printf '%s\n' "$other" >&2
            exit 1
          fi

          echo "SQL block verified: ${select_count} SELECT statements plus BEGIN, SET TRANSACTION READ ONLY and ROLLBACK (${total_count} statements in total). No write statements."

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIPO_AWS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "BLOCKED-PROD: the production environment has no MIPO_AWS_SSH_PRIVATE_KEY." >&2
            echo "There is no other route to the database, and no fallback will be attempted." >&2
            exit 1
          fi
          if [ -z "${MIPO_AWS_HOST}" ]; then
            echo "BLOCKED-PROD: MIPO_AWS_HOST is empty for the production environment." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mipo_aws_key
          chmod 600 ~/.ssh/mipo_aws_key
          ssh-keyscan -T 30 -H "$MIPO_AWS_HOST" >> ~/.ssh/known_hosts || true
          echo "SSH configured for ${MIPO_AWS_USER}@${MIPO_AWS_HOST}"

      - name: List suspect orders on production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mipo_aws_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "${MIPO_AWS_USER}@${MIPO_AWS_HOST}" \
            "MIPO_REMOTE_PATH='${MIPO_REMOTE_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          # No `set -x` anywhere in this script, on purpose: tracing would echo
          # the line that expands DATABASE_URL.

          ENV_FILE="${MIPO_REMOTE_PATH}/.env"
          PG_IMAGE="${MIPO_PG_IMAGE:-postgres:16-alpine}"

          if [ ! -f "$ENV_FILE" ]; then
            echo "BLOCKED-PROD: no env file at $ENV_FILE" >&2
            exit 1
          fi

          DATABASE_URL="$(grep -E '^[[:space:]]*(export[[:space:]]+)?DATABASE_URL=' "$ENV_FILE" | tail -1 | cut -d= -f2- || true)"
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          DATABASE_URL="${DATABASE_URL%\"}"; DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\'}"; DATABASE_URL="${DATABASE_URL#\'}"

          if [ -z "$DATABASE_URL" ]; then
            echo "BLOCKED-PROD: DATABASE_URL is not set in $ENV_FILE" >&2
            exit 1
          fi

          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "BLOCKED-PROD: DATABASE_URL in $ENV_FILE does not begin with postgres:// or postgresql://." >&2
              exit 1
              ;;
          esac

          echo "Connection string located in $ENV_FILE. Not printed."

          CARDCOM_SQL="$(cat <<'SQL'
          -- CARDCOM-SQL-BEGIN
          \pset pager off
          \timing off

          BEGIN;
          SET TRANSACTION READ ONLY;

          \echo '### CARDCOM-01 - the four notified orders'
          -- Not a claim that each was charged. CARDCOM-02 is the callback
          -- evidence we stored. The August/September mail is the evidence we
          -- did not store, and it is written up in the pull request.
          select id,
                 order_number,
                 status,
                 payment_status,
                 payment_method,
                 payment_transaction_id,
                 total,
                 created_at,
                 updated_at
            from public.orders
           where order_number in (
                   'MIPO-20260811-CA060E',
                   'MIPO-20260818-8B5E6A',
                   'MIPO-20260830-B7B4A1',
                   'MIPO-20260915-7273B1'
                 )
              or id in (
                   '8fff9d22-3a5c-47cb-a277-d88bd982e6ee',
                   'c5c296ba-4a2a-49bf-92b1-39932c797836',
                   '1ebfd4fa-d803-46a1-841f-67cb6f3c2118',
                   '5d53011c-c35e-4554-ae55-5e12685ff499'
                 )
           order by created_at;

          \echo '### CARDCOM-02 - events already stored for those orders'
          select e.order_id,
                 e.low_profile_code,
                 e.operation_response,
                 e.deal_response,
                 e.is_success,
                 e.payload_json->>'stage' as stage,
                 e.received_at
            from public.cardcom_events e
           where e.order_id in (
                   '8fff9d22-3a5c-47cb-a277-d88bd982e6ee',
                   'c5c296ba-4a2a-49bf-92b1-39932c797836',
                   '1ebfd4fa-d803-46a1-841f-67cb6f3c2118',
                   '5d53011c-c35e-4554-ae55-5e12685ff499'
                 )
           order by e.received_at;

          \echo '### CARDCOM-03 - credit-card orders that are not paid'
          -- A started checkout that the buyer abandoned looks the same here as
          -- a capture the webhook rejected. payment_status and whether a
          -- verified_indicator event exists are what this database can say.
          -- Confirming a capture still requires Cardcom's back office.
          select o.id,
                 o.order_number,
                 o.status,
                 o.payment_status,
                 o.payment_transaction_id,
                 o.total,
                 o.created_at,
                 o.updated_at,
                 exists (
                   select 1
                     from public.cardcom_events e
                    where e.order_id = o.id
                      and e.is_success
                      and e.payload_json->>'stage' = 'verified_indicator'
                 ) as has_verified_success_event
            from public.orders o
           where o.payment_method = 'credit-card'
             and o.payment_status not in ('paid', 'refunded', 'awaiting_cod')
             and (
               o.payment_transaction_id is not null
               or exists (
                 select 1 from public.cardcom_events e where e.order_id = o.id
               )
             )
           order by o.created_at desc
           limit 100;

          \echo '### CARDCOM-04 - credit-card payment_status counts'
          select payment_status, count(*) as n
            from public.orders
           where payment_method = 'credit-card'
           group by payment_status
           order by payment_status;

          \echo '### CARDCOM-05 - verified success event on an order that is not paid'
          select o.id,
                 o.order_number,
                 o.payment_status,
                 o.status,
                 o.total,
                 e.low_profile_code,
                 e.operation_response,
                 e.deal_response,
                 e.received_at
            from public.cardcom_events e
            join public.orders o on o.id = e.order_id
           where e.is_success
             and e.payload_json->>'stage' = 'verified_indicator'
             and o.payment_status is distinct from 'paid'
           order by e.received_at;

          ROLLBACK;
          -- CARDCOM-SQL-END
          SQL
          )"
          export CARDCOM_SQL
          export DATABASE_URL

          redact() {
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]"]*#<redacted-connection-string>#g' \
              -e 's#^psql: error:.*#psql: error: <connection details redacted>#'
          }

          set +e
          docker run --rm \
            -e PGCONNECT_TIMEOUT=15 \
            --env DATABASE_URL \
            --env CARDCOM_SQL \
            "$PG_IMAGE" \
            sh -c 'printf "%s\n" "$CARDCOM_SQL" | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X' </dev/null 2>&1 | redact
          psql_status="${PIPESTATUS[0]}"
          set -e

          case "$psql_status" in
            0)
              echo "Cardcom list complete. Nothing on this host was modified."
              ;;
            2)
              echo "BLOCKED-PROD: could not connect to the database (psql exit 2). Details redacted above." >&2
              exit 2
              ;;
            3)
              echo "Cardcom list failed: a statement was rejected by the server (psql exit 3). The server error is above, unredacted." >&2
              exit 3
              ;;
            *)
              echo "Cardcom list failed: docker/psql exited ${psql_status}." >&2
              exit "$psql_status"
              ;;
          esac
          REMOTE

      - name: Remove the key
        if: always()
        run: |
          set -euo pipefail
          rm -f ~/.ssh/mipo_aws_key
          echo "Key removed from the runner."
